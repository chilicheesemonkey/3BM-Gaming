
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <title>NETLII | Home</title>
    <style>
        :root {
            --text-color: #1a1a1a;
            --container-bg: rgba(255, 255, 255, 0.8);
            --body-bg: #f4f4f4;
            --bg-image: url('netlii-bg.avif');
        }

        [data-theme="dark"] {
            --text-color: #ffffff;
            --container-bg: rgba(0, 0, 0, 0.6);
            --body-bg: #121212;
            /* Using the provided background image for dark mode */
            --bg-image: url('netlii-bg 2.avif');
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            background-color: var(--body-bg);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        /* Theme Toggle Styling */
        .theme-switch-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(26px); }

        .mode-label {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main UI Container */
        .glass-panel {
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            width: 85%;
            max-width: 600px;
            transition: background 0.4s ease;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            letter-spacing: 10px;
            font-weight: 900;
        }

        .search-bar {
            width: 90%;
            padding: 15px 25px;
            border-radius: 50px;
            border: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            font-size: 1.1rem;
            margin-bottom: 40px;
            outline: none;
            transition: border-color 0.4s ease;
        }

        .nav-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
            text-decoration: none;
            transition: transform 0.2s;
        }

        .nav-item:hover { transform: translateY(-5px); }

        .icon-circle {
            width: 60px;
            height: 60px;
            border: 2px solid var(--text-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .icon-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="theme-switch-wrapper">
        <span class="mode-label">Dark Mode</span>
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="glass-panel">
        <h1>NETLII</h1>
        <text id="subtitle">...</text></br>
        <input type="text" id="home-search" class="search-bar" placeholder="Search">
        <div class="nav-row">
            <a href="./projects" class="nav-item">
                <div class="icon-circle">🎮</div>
                <span class="icon-label">Games</span>
            </a>
            <a href="./apps" class="nav-item">
                <div class="icon-circle">📱</div>
                <span class="icon-label">Apps</span>
            </a>
            <a href="./chatbot" class="nav-item">
                <div class="icon-circle">🤖</div>
                <span class="icon-label">Chat AI</span>
            </a>
            <a href="./web/#https://netlii-games.pages.dev/movies-and-tv" class="nav-item">
                <div class="icon-circle">🍿</div>
                <span class="icon-label">Movies</span>
            </a>
        </div>
    </div>
    <script src="/js/subtitle.js"></script>
   <script>
       // Updated Search Logic for web
const homeSearch = document.getElementById('home-search');

function search(query) {
    const searchEngine = "https://www.google.com/search?q=";
    
    // Check if it's a URL
    if (query.includes('.') && !query.includes(' ')) {
        let url = query;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }
        // Redirect to the Nexus embed page with the URL
        window.location.href = `./web/#${url}`;
    } else {
        // Redirect to the Nexus embed page with a Google search
        window.location.href = `./web/#${searchEngine}${encodeURIComponent(query)}`;
    }
}

homeSearch.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        const query = homeSearch.value.trim();
        if (query) {
            search(query);
        }
    }
});
   </script>
   <script>
             // Theme Toggle Logic
        const toggleSwitch = document.querySelector('#theme-toggle');
        
        function switchTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }    
        }

        toggleSwitch.addEventListener('change', switchTheme, false);

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);
            if (currentTheme === 'dark') {
                toggleSwitch.checked = true;
            }
        }
   </script>
</body>
</html>
